name: Moonlight Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'signing/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build signed Moonlight APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          # The native engine needs the pinned NDK and CMake; AGP will not fetch them
          # on its own in CI.
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" \
            "platform-tools" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build signed release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signature, package and SDK levels
        shell: bash
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          echo "APK=$APK"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)"
          "$BT/apksigner" verify --print-certs --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" | head -n 20 || true
          echo '--- native libraries ---'
          unzip -l "$APK" | grep -E 'lib/[^/]+/.*\.so' || echo 'no native libraries'
          ls -lh "$APK"

      - name: Upload Moonlight APK
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-build-logs
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
