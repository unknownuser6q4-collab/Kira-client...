plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropertiesFile = rootProject.file('signing/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream -> keystoreProperties.load(stream) }
}
def releaseKeystore = rootProject.file(
        keystoreProperties.getProperty('storeFile', 'signing/moonlight-release.jks'))
def hasReleaseKey = releaseKeystore.exists()

android {
    namespace 'com.moonlight.bedrockclient'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.moonlight.bedrockclient'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
        resConfigs 'en'
        // Bedrock is 64-bit only, and the native engine ships a single arm64-v8a
        // library. Restricting the ABI keeps the APK small and avoids the
        // "declares an ABI it does not provide" class of install failure.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile releaseKeystore
                storePassword keystoreProperties.getProperty('storePassword', '')
                keyAlias keystoreProperties.getProperty('keyAlias', 'moonlight')
                keyPassword keystoreProperties.getProperty('keyPassword', '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasReleaseKey ? signingConfigs.release : null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Sign debug builds with the same stable key so installs always update in place.
            signingConfig hasReleaseKey ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
